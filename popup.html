<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        width: 300px;
        font-family: "Segoe UI", sans-serif;
        background: #0f172a;
        color: white;
        padding: 15px;
      }
      h2 {
        font-size: 16px;
        margin-top: 0;
        color: #60a5fa;
      }
      input {
        width: 100%;
        padding: 8px;
        margin: 10px 0;
        background: #1e293b;
        border: 1px solid #334155;
        color: white;
        border-radius: 6px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 10px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        transition: background 0.2s;
      }
      button:hover {
        background: #1d4ed8;
      }
      .status {
        font-size: 12px;
        color: #94a3b8;
        margin-top: 10px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h2>Mètis AI</h2>

    <label for="apiKey" style="font-size: 12px; color: #cbd5e1"
      >Gemini API Key</label
    >
    <input
      type="password"
      id="apiKey"
      placeholder="Incolla qui la tua API Key"
    />

    <button id="startBtn">Avvia Ascolto</button>

    <div class="status" id="statusMsg">Pronto per Teams, Meet o Zoom</div>

    <script src="popup.js"></script>
  </body>
</html>
